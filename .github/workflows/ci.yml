name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  atom:
    # one OS is honest here: the atom is an HTTP client plus a bash/python harness, both of which the runner and CI
    # treat the same way everywhere; the fake Datadog is python3, which every GitHub runner has
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # the atom is built against the SDK and packages it, so CI builds the SDK first
      - uses: actions/checkout@v4
        with:
          repository: hummerstudio/jenkins-atom-sdk
          path: jenkins-atom-sdk
      - name: Build the SDK
        working-directory: jenkins-atom-sdk
        run: mvn -B -ntp -q package -DskipTests
      - name: Build and smoke test the atom
        run: ./tools/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: datadog-metrics-atom
          path: dist/datadog-metrics/
